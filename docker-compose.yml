
services:
  backend:
    build: /home/ubuntu/roamwise-backend
    container_name: roamwise-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/roamwise
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENWEATHERAPI_KEY: ${OPENWEATHERAPI_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: https://roamwise.live
      CORS_ALLOWED_ORIGINS: https://roamwise.live
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: roamwise-postgres
    environment:
      POSTGRES_DB: roamwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roamwise"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roamwise-redis
    # cache only: no persistence needed
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  frontend:
    build: /home/ubuntu/roamwise-frontend
    container_name: roamwise-frontend
    depends_on:
      - backend
    environment:
      NG_ALLOWED_HOSTS: roamwise.live
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: roamwise-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - backend

    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config: